<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bank Form Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* Minimal CSS for report - full version has 300+ lines */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #14b8a6; min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 24px; 
                     display: flex; flex-direction: column; height: calc(100vh - 40px); }
        .header { padding: 24px; background: #14b8a6; color: white; border-radius: 24px 24px 0 0; }
        .chat-container { flex: 1; overflow-y: auto; padding: 24px; background: #f8fafc; }
        .message { max-width: 75%; padding: 12px 16px; border-radius: 16px; margin-bottom: 12px; }
        .message.assistant { background: #f0fdfa; color: #134e4a; border: 1px solid #99f6e4; }
        .message.user { background: #14b8a6; color: white; margin-left: auto; }
        .input-area { padding: 20px; background: white; border-top: 2px solid #99f6e4; }
        .btn { padding: 15px 25px; border: none; border-radius: 12px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>🏦 Bank Form Assistant</h1></div>
        <div class="chat-container" id="chatContainer">
            <div class="message assistant">Hello! Which branch are you visiting?</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type your answer...">
            <button id="voiceBtn" class="btn">🎤</button>
            <button id="sendBtn" class="btn">Send</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        
        let sessionId = 'session_' + Date.now();
        let mediaRecorder, audioChunks = [], isRecording = false;
        let voiceEnabled = true;

        // Send text message to AI
        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            userInput.value = '';

            const response = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message, session_id: sessionId })
            });

            const data = await response.json();
            if (data.success) {
                addMessage(data.response, 'assistant');
                speakText(data.response);  // Text-to-speech
                
                if (data.form_complete) {
                    localStorage.setItem('depositSlipData', JSON.stringify(data.form_data));
                    showFormButton();
                }
            }
        }

        // Display message in chat
        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerHTML = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Text-to-Speech
        function speakText(text) {
            if (!voiceEnabled) return;
            const utterance = new SpeechSynthesisUtterance(text.replace(/<[^>]*>/g, ''));
            utterance.rate = 0.9;
            speechSynthesis.speak(utterance);
        }

        // Voice input - Speech-to-Text
        async function toggleRecording() {
            if (!isRecording) {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const formData = new FormData();
                    formData.append('audio', audioBlob);

                    const response = await fetch('/transcribe', { method: 'POST', body: formData });
                    const data = await response.json();
                    if (data.success) userInput.value = data.text;
                    
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                isRecording = true;
                voiceBtn.textContent = '⏹️';
            } else {
                mediaRecorder.stop();
                isRecording = false;
                voiceBtn.textContent = '🎤';
            }
        }

        // Show form button when complete
        function showFormButton() {
            const btn = document.createElement('button');
            btn.textContent = '📄 View & Print Form';
            btn.className = 'btn';
            btn.onclick = () => window.open('/form', '_blank');
            chatContainer.appendChild(btn);
        }

        // Event listeners
        sendBtn.onclick = sendMessage;
        userInput.onkeypress = e => { if (e.key === 'Enter') sendMessage(); };
        voiceBtn.onclick = toggleRecording;
    </script>
</body>
</html>
